<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta y registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #232D4F; --indigo: #393793; --violeta: #B369ED; --tile: #E8E9F1; --borde: #D5D8E3; --texto2: #4F5672; --ok: #2E7D32; --error: #C62828; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Montserrat, system-ui, sans-serif; color: var(--navy); background: #F5F6FA; line-height: 1.5; }
  header { background: var(--navy); color: #fff; }
  .top { max-width: 720px; margin: 0 auto; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
  .top b { font-weight: 800; font-size: 17px; }
  .top img { height: 28px; display: block; }
  .mosaico { display: grid; grid-template-columns: 3fr 1fr 2fr 1fr 4fr 1fr 2fr; height: 34px; }
  .mosaico span { display: grid; place-items: center; color: #fff; font-size: 15px; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 4px; line-height: 1.2; }
  .sub { color: var(--texto2); margin: 0 0 28px; }
  .num { font-size: 13px; font-weight: 600; color: var(--indigo); margin: 8px 0; letter-spacing: .02em; }
  .card { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 18px; font-weight: 800; margin: 0 0 14px; line-height: 1.3; }
  fieldset { border: 0; padding: 0; margin: 0 0 12px; }
  legend { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .opcion, .chip { position: relative; cursor: pointer; }
  .opcion input, .chip input { position: absolute; opacity: 0; }
  .opcion span { display: flex; gap: 8px; align-items: center; border: 2px solid var(--borde); border-radius: 8px; padding: 12px; font-weight: 500; }
  .opcion input:checked + span { border-color: var(--indigo); background: #EFEEFA; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip span { display: inline-block; border: 2px solid var(--borde); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
  .chip input:checked + span { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .opcion input:focus-visible + span, .chip input:focus-visible + span, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--violeta); outline-offset: 2px; }
  label.campo { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  label.campo small { font-weight: 400; color: var(--texto2); }
  textarea, input[type=text], input[type=email] { width: 100%; font: inherit; color: inherit; border: 2px solid var(--borde); border-radius: 8px; padding: 10px; background: #fff; }
  textarea { min-height: 80px; resize: vertical; }
  button { font: inherit; font-weight: 600; background: var(--navy); color: #fff; border: 2px solid var(--navy); border-radius: 8px; padding: 10px 20px; cursor: pointer; margin: 14px 6px 0 0; }
  button.secundario { background: #fff; color: var(--navy); border-color: var(--borde); }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { font-size: 14px; margin: 10px 0 0; }
  .msg.error { color: var(--error); }
  .hecho { display: flex; gap: 10px; align-items: center; color: var(--ok); font-weight: 600; }
  .demo { background: #FFF6DB; border: 1px solid #F0D58A; color: #6B4E00; font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 20px; }
  .espera { text-align: center; padding: 48px 0; }
  .pulso { width: 14px; height: 14px; border-radius: 50%; background: var(--violeta); margin: 0 auto 24px; animation: pulso 1.6s infinite; }
  @keyframes pulso { 50% { opacity: .3; transform: scale(1.6); } }
  @media (prefers-reduced-motion: reduce) { .pulso { animation: none; } }
  .lista { display: grid; gap: 8px; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; margin: 0; padding: 16px; text-align: left; background: #fff; color: var(--navy); border: 2px solid var(--borde); }
  .item .estado { font-size: 13px; color: var(--indigo); white-space: nowrap; }
  .item.ok { border-color: var(--ok); background: #EEF7EE; }
  .item.ok .estado { color: var(--ok); }
  button.volver { margin: 0 0 16px; }
  .temas { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0 0 16px; }
  .temas li { background: var(--tile); border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 500; }

  /* pantalla del presentador */
  body.pantalla main, body.pantalla .top { max-width: 1280px; }
  .controles { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .controles button { margin: 0; }
  .controles span { flex: 1; text-align: center; font-weight: 800; font-size: 18px; }
  .controles .msg { flex-basis: 100%; text-align: center; margin: 0; }
  .bienvenida { display: flex; gap: 48px; align-items: center; justify-content: center; padding: 32px 0; flex-wrap: wrap; }
  .bienvenida #qr { background: #fff; padding: 16px; border-radius: 10px; border: 1px solid var(--borde); }
  .bienvenida h1 { font-size: 36px; }
  .url { font-size: 28px; font-weight: 800; color: var(--indigo); word-break: break-all; margin: 8px 0 0; }
  .resumen { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .mini { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 14px; text-align: left; background: #fff; color: var(--navy); border: 1px solid var(--borde); border-radius: 10px; font-weight: 500; }
  .mini:hover { border-color: var(--indigo); }
  .mini .barra { margin: 2px 0; width: 100%; }
  .presentes { font-size: 18px; font-weight: 600; margin: 16px 0 0; }
  .grilla { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
  .qr { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 16px; text-align: center; position: sticky; top: 16px; }
  .qr #qr { display: flex; justify-content: center; margin: 8px 0; }
  .qr p { margin: 0; font-size: 14px; word-break: break-all; }
  .grande { font-size: 44px; font-weight: 800; color: var(--indigo); line-height: 1; }
  .barra { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--tile); margin: 10px 0 8px; }
  .barra div { transition: width .4s; }
  .ley { display: flex; gap: 18px; font-size: 14px; flex-wrap: wrap; }
  .ley i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .coment { border-left: 3px solid var(--violeta); background: #F6F4FC; padding: 6px 10px; margin: 8px 0 0; font-size: 15px; }
  .nec { display: grid; grid-template-columns: 180px 1fr 40px; gap: 10px; align-items: center; margin: 8px 0; font-size: 15px; }
  .nec .barra { margin: 0; }
  @media (max-width: 760px) { .grilla { grid-template-columns: 1fr; } .qr { position: static; } .nec { grid-template-columns: 110px 1fr 32px; } }
</style>
</head>
<body>
<header>
  <div class="top"><span id="org"></span><span id="evento"></span></div>
  <div class="mosaico" aria-hidden="true">
    <span style="background:var(--navy)">≠</span><span style="background:var(--violeta)">á</span><span style="background:var(--indigo)">↑</span><span style="background:var(--tile);color:var(--navy)">@</span><span style="background:var(--indigo)">≥</span><span style="background:var(--violeta)">π</span><span style="background:var(--navy)">»</span>
  </div>
</header>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script type="module">
import { leerConsulta } from './consulta.js';

// ===== Configuración técnica (se toca una vez). Las preguntas están en consulta.md =====
const CONFIG = {
  supabaseUrl: 'https://rtfazosvnvtdldswxgua.supabase.co', // vacío = modo demo (guarda en este navegador)
  supabaseKey: 'sb_publishable_nFEuOTho3mWWmAR2fvhVPQ_g-jG-aqh', // pública por diseño: la seguridad la ponen las políticas de schema.sql
  organismo: 'datos.gob.ar',
  logo: 'img/logo-datos-gob-ar-blanco.png', // versión blanca (la del theme de gobar); vacío = el nombre como texto
  evento: 'Jornada de Datos Abiertos 2026',
};
// ======================================================================================

// Demo también con ?demo, para probar sin tocar la base real.
const DEMO = !CONFIG.supabaseUrl || new URLSearchParams(location.search).has('demo');
const OPCIONES = { favor: 'Ok', contra: 'No', comentario: 'Comentar' };
const URL_PARTICIPAR = location.href.split('#')[0];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const leer = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };

let pid = localStorage.getItem('pid');
if (!pid) localStorage.setItem('pid', pid = crypto.randomUUID());

// ---------- Datos: Supabase, o localStorage en modo demo ----------
const sb = DEMO ? null : supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
const ok = ({ data, error }) => { if (error) throw error; return data; };
const YA_EXISTE = '23505'; // violación de unique: ya votó esa pregunta o ya se registró

// ponytail: modo demo en localStorage; solo ve los datos de este navegador (sirve con dos pestañas).
function guardarDemo(k, fila) {
  const filas = leer(k);
  if (filas.some(f => f.participante === fila.participante && f.pregunta === fila.pregunta)) throw { code: YA_EXISTE }; // registros: sin pregunta
  localStorage.setItem(k, JSON.stringify([{ ...fila, id: Date.now() + Math.random(), creado: new Date().toISOString() }, ...filas]));
}

const api = {
  votar: async v => DEMO ? guardarDemo('votos', v) : ok(await sb.from('votos').insert(v)),
  registrar: async r => DEMO ? guardarDemo('registros', r) : ok(await sb.from('registros').insert(r)),
  votos: async () => DEMO ? leer('votos') : ok(await sb.from('votos').select('id,pregunta,opcion,comentario').order('creado', { ascending: false })),
  // Solo totales: los datos personales del registro no se pueden leer desde la web.
  resumenRegistros: async () => {
    if (!DEMO) return ok(await sb.rpc('resumen_registros'));
    const regs = leer('registros'), c = {};
    regs.forEach(r => r.necesidades.forEach(n => c[n] = (c[n] || 0) + 1));
    return { total: regs.length, necesidades: Object.entries(c).map(([necesidad, total]) => ({ necesidad, total })).sort((a, b) => b.total - a.total) };
  },
  paso: async () => valido(DEMO ? localStorage.getItem('paso') : ok(await sb.from('estado').select('paso').eq('id', 1).single()).paso),
  cambiarPaso: async (clave, paso) => DEMO ? localStorage.setItem('paso', paso) : ok(await sb.rpc('cambiar_paso', { p_clave: clave, p_paso: paso })),
  // Avisos al instante (Supabase Realtime). El polling de cada vista queda de respaldo si se corta la conexión.
  escuchar({ alPaso, alVoto, alPresentes }) {
    if (DEMO) {
      addEventListener('storage', e => { if (e.key === 'paso') alPaso(valido(e.newValue)); if (e.key === 'votos') alVoto?.(); });
      return;
    }
    // Supabase solo manda la lista de presentes a quien también se anuncia: la pantalla se anuncia con otra clave y no se cuenta.
    const PANTALLA = 'pantalla-';
    const canal = sb.channel('sala', { config: { presence: { key: alPresentes ? PANTALLA + pid : pid } } })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'estado' }, x => alPaso(valido(x.new.paso)));
    if (alVoto) canal.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'votos' }, x => alVoto(x.new));
    if (alPresentes) canal.on('presence', { event: 'sync' }, () =>
      alPresentes(Object.keys(canal.presenceState()).filter(k => !k.startsWith(PANTALLA)).length));
    canal.subscribe(estado => { if (estado === 'SUBSCRIBED') canal.track({}); });
  },
};

// ---------- Estado compartido de las vistas ----------
let C;            // la consulta leída de consulta.md
let PASOS;        // inicio → preguntas y registro en el orden de consulta.md → fin
let pasoActual, timer;
const valido = paso => PASOS.includes(paso) ? paso : 'inicio'; // p. ej. una pregunta que se renombró en consulta.md
const pregunta = id => C.preguntas.find(p => p.id === id);
const nombrePaso = paso =>
  paso === 'inicio' ? 'Bienvenida' : paso === 'registro' ? 'Registro' : paso === 'fin' ? 'Cierre' : paso === 'lista' ? 'Consulta abierta' :
  `Pregunta ${C.preguntas.findIndex(p => p.id === paso) + 1} de ${C.preguntas.length}`;
const listaTemas = p => p.temas.length ? `<ul class="temas">${p.temas.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : '';
const respondida = p => localStorage.getItem('votado:' + p.id);
const descripcion = x => x.descripcion ? `<p class="sub" style="margin:-6px 0 14px">${esc(x.descripcion)}</p>` : '';
const hecho = texto => `<p class="hecho"><span aria-hidden="true">✓</span> ${texto}</p>`;
const espera = (titulo, texto) => `<div class="espera"><div class="pulso" aria-hidden="true"></div><h1>${titulo}</h1><p class="sub">${texto}</p></div>`;
function mensaje(el, texto, esError = true) { el.className = esError ? 'msg error' : 'msg'; el.textContent = texto; }

// ---------- Participante: sigue el paso que elige el presentador ----------
function participante() {
  const ir = paso => { if (paso && paso !== pasoActual) vistaParticipante(pasoActual = paso); };
  const sondear = async () => {
    clearTimeout(timer);
    try { ir(await api.paso()); }
    catch { if (!pasoActual) $('#app').innerHTML = espera('Conectando…', 'Revisá tu conexión. Seguimos intentando.'); }
    timer = setTimeout(sondear, DEMO ? 3000 : 10000);
  };
  api.escuchar({ alPaso: ir });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sondear(); }); // al desbloquear el celular
  sondear();
}

const avisoDemo = () => DEMO ? '<p class="demo">Modo demo: los datos se guardan solo en este navegador.</p>' : '';

// Si el registro va primero en consulta.md, se pide apenas entran (en la bienvenida) y es obligatorio para responder.
const faltaRegistro = paso => C.pasos[0] === 'registro' && !localStorage.getItem('registrado') && paso !== 'fin';

function vistaParticipante(paso) {
  if (faltaRegistro(paso)) paso = 'registro';
  if (paso === 'lista') return vistaLista();
  const p = pregunta(paso);
  $('#app').innerHTML = avisoDemo() + (
    p ? formPregunta(p) :
    paso === 'registro' && C.registro ? formRegistro() :
    paso === 'fin' ? espera('¡Gracias por participar!', 'Ya podés cerrar esta página.') :
    espera('Ya estás adentro', `${esc(C.instrucciones)} Cuando empiece la presentación vas a ver acá cada pregunta, sin recargar.`));
  conectarFormularios();
}

// Modo libre: la persona elige qué pregunta responder y vuelve a la lista, donde las respondidas quedan en verde.
let elegida = null;
function vistaLista() {
  const p = pregunta(elegida);
  if (p) {
    $('#app').innerHTML = avisoDemo() + '<button type="button" class="secundario volver" id="volver">← Volver a la lista</button>' + formPregunta(p);
    $('#volver').onclick = () => { elegida = null; vistaLista(); };
    conectarFormularios();
    return;
  }
  const hechas = C.preguntas.filter(respondida).length;
  $('#app').innerHTML = avisoDemo() + `
    <h1>${esc(C.titulo)}</h1><p class="sub">${esc(C.instrucciones)}</p>
    <p class="num">${hechas} de ${C.preguntas.length} respondidas</p>
    <div class="lista">${C.preguntas.map(p => `
      <button type="button" class="item${respondida(p) ? ' ok' : ''}" data-id="${esc(p.id)}">
        <span>${esc(p.texto)}</span><span class="estado">${respondida(p) ? '✓ Respondida' : 'Responder →'}</span>
      </button>`).join('')}</div>`;
  document.querySelectorAll('.item').forEach(b => b.onclick = () => { elegida = b.dataset.id; vistaLista(); scrollTo(0, 0); });
}

const formPregunta = p => `
  <p class="num">${C.modo === 'libre' ? 'Supertema' : nombrePaso(p.id)}</p>
  <form class="card" data-pregunta="${esc(p.id)}" novalidate>
    <h2>${esc(p.texto)}</h2>
    ${descripcion(p)}
    ${listaTemas(p)}
    ${respondida(p) ? hecho('Ya registramos tu respuesta. Mirá la pantalla para ver los resultados.') : `
    <fieldset><legend>Tu opinión</legend><div class="opciones">
      ${Object.entries(OPCIONES).map(([v, t]) => `<label class="opcion"><input type="radio" name="opcion" value="${v}"><span>${t}</span></label>`).join('')}
    </div></fieldset>
    <label class="campo" for="comentario">Comentario <small>(opcional si elegís ${OPCIONES.favor} o ${OPCIONES.contra})</small></label>
    <textarea id="comentario" name="comentario" maxlength="1000"></textarea>
    <button type="submit">Enviar respuesta</button>${C.modo === 'libre' ? '' : '<button type="button" class="secundario" id="omitir">Omitir</button>'}
    <p class="msg" role="status"></p>`}
  </form>`;

// Para que el celular ofrezca autocompletar con los datos guardados de la persona.
const AUTOCOMPLETAR = [[/mail/i, 'email'], [/apellido/i, 'family-name'], [/nombre/i, 'given-name'], [/tel[eé]fono|celular/i, 'tel'], [/organismo|organizaci|empresa|instituci/i, 'organization']];
const autocompletar = nombre => AUTOCOMPLETAR.find(([re]) => re.test(nombre))?.[1] || 'on';

const formRegistro = () => {
  const { titulo, opciones, tituloCampos, campos } = C.registro;
  return `
  <p class="num">Registro</p>
  <form class="card" id="registro" novalidate>
    ${localStorage.getItem('registrado') ? hecho('Recibimos tu registro. ¡Gracias!') : `
    <h2>${esc(titulo)}</h2>
    ${descripcion(C.registro)}
    ${opciones.length ? `<fieldset><legend>Elegí una o más opciones</legend><div class="chips">
      ${opciones.map(n => `<label class="chip"><input type="checkbox" name="opcion" value="${esc(n)}"><span>${esc(n)}</span></label>`).join('')}
    </div></fieldset>` : ''}
    ${tituloCampos ? `<p class="num" style="margin-top:20px">${esc(tituloCampos)}</p>` : ''}
    ${campos.map((c, i) => `
      <label class="campo" for="campo-${i}">${esc(c.nombre)}${c.obligatorio ? '' : ' <small>(opcional)</small>'}</label>
      <input type="${c.tipo}" id="campo-${i}" name="campo-${i}" maxlength="200" autocomplete="${autocompletar(c.nombre)}">`).join('')}
    <button type="submit">Registrar</button>
    <p class="msg" role="status"></p>`}
  </form>`;
};

function conectarFormularios() {
  const form = $('form[data-pregunta]');
  if (form?.querySelector('button')) {
    const id = form.dataset.pregunta, msg = form.querySelector('.msg'), boton = form.querySelector('[type=submit]');
    const cerrar = texto => {
      localStorage.setItem('votado:' + id, '1');
      if (C.modo === 'libre') { elegida = null; return vistaLista(); } // vuelve a la lista, con esta en verde
      form.innerHTML = `<h2>${esc(pregunta(id).texto)}</h2>` + hecho(texto);
    };
    form.onsubmit = async e => {
      e.preventDefault();
      const d = new FormData(form), opcion = d.get('opcion'), comentario = d.get('comentario').trim();
      if (!opcion) return mensaje(msg, 'Elegí una opción antes de enviar.');
      if (opcion === 'comentario' && !comentario) return mensaje(msg, 'Escribí tu comentario antes de enviar.');
      boton.disabled = true;
      try { await api.votar({ pregunta: id, participante: pid, opcion, comentario: comentario || null }); }
      catch (err) {
        if (err.code !== YA_EXISTE) { boton.disabled = false; return mensaje(msg, 'No pudimos guardar tu respuesta. Revisá la conexión y probá de nuevo.'); }
      }
      cerrar('¡Gracias! Mirá la pantalla para ver los resultados.');
    };
    // ponytail: "Omitir" no se guarda en la base, solo cierra la pregunta en este celular.
    if ($('#omitir')) $('#omitir').onclick = () => cerrar('Omitiste esta pregunta. Esperá la siguiente.');
  }

  const reg = $('#registro');
  if (reg?.querySelector('button')) reg.onsubmit = async e => {
    e.preventDefault();
    const msg = reg.querySelector('.msg'), necesidades = new FormData(reg).getAll('opcion');
    if (C.registro.opciones.length && !necesidades.length) return mensaje(msg, 'Elegí al menos una opción.');
    const datos = {};
    for (const [i, c] of C.registro.campos.entries()) {
      const input = reg[`campo-${i}`], valor = input.value.trim();
      if (c.obligatorio && !valor) { input.focus(); return mensaje(msg, `Completá ${c.nombre}.`); }
      if (valor && !input.checkValidity()) { input.focus(); return mensaje(msg, `Revisá ${c.nombre}: parece incompleto.`); }
      if (valor) datos[c.nombre] = valor;
    }
    reg.querySelector('button').disabled = true;
    try { await api.registrar({ participante: pid, necesidades, datos }); }
    catch (err) {
      if (err.code !== YA_EXISTE) { reg.querySelector('button').disabled = false; return mensaje(msg, 'No pudimos guardar el registro. Revisá la conexión y probá de nuevo.'); }
    }
    localStorage.setItem('registrado', '1'); // YA_EXISTE = ya estaba registrado: lo tratamos como hecho
    if (pasoActual !== 'registro') return vistaParticipante(pasoActual); // entró tarde: sigue a donde está la presentación
    reg.innerHTML = hecho(C.pasos[0] === 'registro' ? '¡Listo! En unos momentos arrancamos.' : 'Recibimos tu registro. ¡Gracias!');
  };
}

// ---------- Presentador: #pantalla/CLAVE ----------
const clave = decodeURIComponent(location.hash.split('/')[1] || '');
let votos = [], registros = { total: 0, necesidades: [] }, presentes = null;
let detalle = null; // modo libre: pregunta que la pantalla muestra en detalle (solo en esta pantalla)
let ultimoCambio = 0; // una lectura que salió antes de terminar un cambio de paso trae el paso viejo: se ignora

function pantalla() {
  document.body.className = 'pantalla';
  const manda = DEMO || clave;
  $('#app').innerHTML = `
    <div class="controles">
      ${manda ? '<button id="ant" type="button" class="secundario">← Anterior</button>' : ''}
      <span id="paso-nombre"></span>
      ${manda ? '<button id="sig" type="button">Siguiente →</button>' : ''}
      <p class="msg" role="status">${manda ? '' : 'Solo lectura. Para manejar la presentación abrí esta pantalla con #pantalla/TU-CLAVE.'}</p>
    </div>
    <div id="escena"></div>`;
  $('#escena').onclick = e => { // modo libre: abrir una pregunta del resumen o volver
    const b = e.target.closest('[data-detalle]');
    if (b) { detalle = b.dataset.detalle || null; pintar(); }
  };
  if (manda) {
    $('#ant').onclick = () => mover(-1);
    $('#sig').onclick = () => mover(1);
    // Flechas, AvPág/RePág y barra espaciadora: funcionan con un control remoto de presentaciones.
    addEventListener('keydown', e => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); mover(1); }
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); mover(-1); }
    });
  }
  api.escuchar({
    alPaso: paso => { if (paso !== pasoActual && Date.now() > ultimoCambio) escena(paso); }, // otro dispositivo cambió el paso
    alVoto: v => {
      if (!v) return refrescar(); // demo: avisa sin datos
      if (!votos.some(x => x.id === v.id)) votos.unshift(v);
      pintar();
    },
    alPresentes: n => { presentes = n; const el = $('#presentes'); if (el) el.textContent = textoPresentes(); },
  });
  refrescar();
}

// Lectura completa: al abrir y como respaldo de Realtime. Los registros no tienen aviso en vivo (son datos privados).
async function refrescar() {
  clearTimeout(timer);
  const inicio = Date.now();
  try {
    const [paso, v, r] = await Promise.all([api.paso(), api.votos(), api.resumenRegistros().catch(() => registros)]); // si falla el resumen, que no corte los votos
    votos = v; registros = r;
    if (paso !== pasoActual && inicio > ultimoCambio) escena(paso); else pintar();
    if ($('.controles .msg').classList.contains('error')) mensaje($('.controles .msg'), '', false);
  } catch {
    mensaje($('.controles .msg'), 'Sin conexión con la base. Reintentando…');
  }
  timer = setTimeout(refrescar, ['registro', 'fin'].includes(pasoActual) || DEMO ? 3000 : 15000);
}

async function mover(delta) {
  const anterior = pasoActual;
  const nuevo = PASOS[Math.min(PASOS.length - 1, Math.max(0, PASOS.indexOf(anterior) + delta))];
  if (nuevo === anterior) return;
  ultimoCambio = Infinity;
  escena(nuevo);
  try {
    await api.cambiarPaso(clave, nuevo);
    if (['registro', 'fin'].includes(nuevo)) refrescar(); // traer los totales del registro ya
  } catch {
    escena(anterior);
    mensaje($('.controles .msg'), 'No se pudo cambiar el paso. Revisá la clave en la dirección (#pantalla/TU-CLAVE).');
  }
  ultimoCambio = Date.now();
}

const textoPresentes = () => presentes === null ? '' : `${presentes} ${presentes === 1 ? 'persona conectada' : 'personas conectadas'}`;

function escena(paso) {
  pasoActual = paso;
  detalle = null;
  $('#paso-nombre').textContent = nombrePaso(paso);
  const url = esc(URL_PARTICIPAR.replace(/^https?:\/\//, ''));
  $('#escena').innerHTML = paso === 'inicio'
    ? `<div class="bienvenida"><div id="qr"></div><div>
        <p class="num">${esc(C.titulo)}</p><h1>Sumate desde tu celular:<br>escaneá el código o entrá a</h1>
        <p class="url">${url}</p><p class="presentes" id="presentes">${textoPresentes()}</p></div></div>`
    : `<div class="grilla"><aside class="qr"><p><b>Sumate desde tu celular</b></p><div id="qr"></div><p>${url}</p></aside><div id="resultados"></div></div>`;
  const lado = paso === 'inicio' ? 320 : 200;
  if (window.QRCode) new QRCode($('#qr'), { text: URL_PARTICIPAR, width: lado, height: lado, colorDark: '#232D4F' });
  pintar();
}

function pintar() {
  const el = $('#resultados');
  if (!el) return;
  const p = pregunta(pasoActual);
  if (pasoActual === 'lista') {
    el.innerHTML = detalle
      ? '<button type="button" class="secundario volver" data-detalle="">← Volver al resumen</button>' + tarjetaPregunta(pregunta(detalle))
      : `<div class="resumen">${C.preguntas.map(miniTarjeta).join('')}</div>`;
    return;
  }
  el.innerHTML = p ? tarjetaPregunta(p) : pasoActual === 'registro' ? tarjetaRegistro()
    : C.preguntas.map(tarjetaPregunta).join('') + (C.registro ? tarjetaRegistro() : '');
}

function conteo(p) {
  const vs = votos.filter(v => v.pregunta === p.id);
  const favor = vs.filter(v => v.opcion === 'favor').length, contra = vs.filter(v => v.opcion === 'contra').length;
  const total = favor + contra;
  return { favor, contra, total, pct: total ? Math.round(favor / total * 100) : 0, n: vs.length, comentarios: vs.filter(v => v.comentario) };
}
const respuestas = n => `${n} ${n === 1 ? 'respuesta' : 'respuestas'}`;
const barra = ({ total, pct }) => `<div class="barra"><div style="width:${pct}%;background:var(--indigo)"></div><div style="width:${total ? 100 - pct : 0}%;background:var(--violeta)"></div></div>`;

function miniTarjeta(p) {
  const c = conteo(p);
  return `<button type="button" class="mini" data-detalle="${esc(p.id)}"><b>${esc(p.texto)}</b>
    <span><span class="grande" style="font-size:30px">${c.total ? c.pct + '%' : '–'}</span> ${OPCIONES.favor}</span>
    ${barra(c)}<span class="ley">${respuestas(c.n)} · ${c.comentarios.length} ${c.comentarios.length === 1 ? 'comentario' : 'comentarios'}</span></button>`;
}

function tarjetaPregunta(p) {
  const { favor, contra, total, pct, n, comentarios } = conteo(p);
  return `<div class="card"><h2>${esc(p.texto)}</h2>
    ${[pasoActual, detalle].includes(p.id) ? descripcion(p) + listaTemas(p) : ''}
    <div style="display:flex;align-items:baseline;gap:10px"><span class="grande">${total ? pct + '%' : '–'}</span><span>${OPCIONES.favor} · ${respuestas(n)}</span></div>
    ${barra({ total, pct })}
    <div class="ley"><span><i style="background:var(--indigo)"></i>${OPCIONES.favor} ${favor}</span><span><i style="background:var(--violeta)"></i>${OPCIONES.contra} ${contra}</span><span>Comentarios ${comentarios.length}</span></div>
    ${comentarios.slice(0, detalle === p.id ? 12 : 4).map(c => `<p class="coment">“${esc(c.comentario)}”</p>`).join('')}
  </div>`;
}

function tarjetaRegistro() {
  const { total, necesidades } = registros, max = Math.max(1, ...necesidades.map(x => x.total));
  return `<div class="card"><h2>${esc(C.registro.titulo)}</h2>
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px"><span class="grande">${total}</span><span>${total === 1 ? 'persona registrada' : 'personas registradas'}</span></div>
    ${necesidades.map(x => `
    <div class="nec"><span>${esc(x.necesidad)}</span><div class="barra"><div style="width:${x.total / max * 100}%;background:var(--navy)"></div></div><b>${x.total}</b></div>`).join('')}
  </div>`;
}

// ---------- Arranque ----------
$('#org').innerHTML = CONFIG.logo ? `<img src="${esc(CONFIG.logo)}" alt="${esc(CONFIG.organismo)}">` : `<b>${esc(CONFIG.organismo)}</b>`;
$('#evento').textContent = CONFIG.evento;
addEventListener('hashchange', () => location.reload()); // cambiar entre participante y pantalla arranca de cero
try {
  const r = await fetch('consulta.md', { cache: 'no-cache' });
  if (!r.ok) throw new Error();
  C = leerConsulta(await r.text());
  PASOS = ['inicio', ...C.pasos, 'fin'];
  location.hash.startsWith('#pantalla') ? pantalla() : participante();
} catch {
  $('#app').innerHTML = espera('No pudimos cargar la consulta', 'Recargá la página en unos segundos.');
}
</script>
</body>
</html>
