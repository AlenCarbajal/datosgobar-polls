<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Participar</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* Solo tokens: los colores salen de css/base.css y temas/*.css */
  [hidden] { display: none !important; }
  main { padding-top: 1rem; }
  #app > .mensaje--aviso { margin: 0 0 1rem; }
  .aviso-paso { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; margin: 0 0 1rem; }
  .aviso-paso p { margin: 0; font-weight: 600; }
  .suave { color: var(--texto-suave); }
  #app > h1 { margin-bottom: 1rem; }
  .espera { text-align: center; padding: 2.5rem 0; }
  .pulso { width: .875rem; height: .875rem; border-radius: 50%; background: var(--color-acento); margin: 0 auto 1.5rem; animation: pulso 1.6s infinite; }
  @keyframes pulso { 50% { opacity: .3; transform: scale(1.6); } }
  @media (prefers-reduced-motion: reduce) { .pulso { animation: none; } }
  .hecho { display: flex; gap: .625rem; align-items: center; color: var(--exito); font-weight: 600; margin: 0; }

  /* Lista: respondidas en verde, con texto además del color */
  .lista { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .5rem; }
  .item {
    display: flex; justify-content: space-between; align-items: center; gap: .75rem; width: 100%; min-height: 44px;
    padding: 1rem; font: inherit; font-weight: 500; text-align: left; cursor: pointer; color: var(--texto);
    background: var(--superficie); border: 2px solid var(--borde-campo); border-radius: var(--radio);
  }
  .item__estado { font-size: .8125rem; font-weight: 600; color: var(--acento-texto); white-space: nowrap; }
  .item--hecho { border-color: var(--exito); background: var(--exito-suave); }
  .item--hecho .item__estado { color: var(--exito); }
  .progreso-texto { font-weight: 600; margin: 1rem 0 .375rem; }
  .barra-superior { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin: 0 0 .75rem; font-weight: 600; color: var(--texto-suave); }
  .barra-superior .boton { padding: .375rem .875rem; }

  /* Detalle de pregunta: compacto para que las opciones entren sin scroll en 375×667 */
  .pregunta h2 { margin-bottom: .5rem; }
  .descripcion { color: var(--texto-suave); margin: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .descripcion.abierta { display: block; }
  .pregunta .etiquetas { margin: .625rem 0 .75rem; }
  .pregunta .opciones { grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); margin-top: .75rem; }
  .pregunta legend { margin-top: 0; }
  /* Botones de texto chicos: el ::after agranda la zona táctil a ≥ 44 px sin ocupar más lugar */
  .enlace, .etiqueta--mas { position: relative; font: inherit; cursor: pointer; }
  .enlace::after, .etiqueta--mas::after { content: ''; position: absolute; inset: -.75rem -.5rem; }
  .enlace { font-weight: 600; color: var(--acento-texto); background: none; border: 0; padding: 0; text-decoration: underline; }
  .etiqueta--mas { border: 0; font-size: .8125rem; font-weight: 700; }
  /* Enviar / Registrar: fijo abajo una vez que hay algo elegido o escrito */
  .con-datos .acciones { position: sticky; bottom: 0; z-index: 1; background: var(--superficie); margin: .25rem 0 0; padding: .75rem 0; }
  @media (max-width: 30rem) { .tarjeta { padding: 1rem; } }
</style>
</head>
<body>
<header class="encabezado">
  <div class="encabezado__interior" id="marca"></div>
  <div class="mosaico" aria-hidden="true"><span>≠</span><span>á</span><span>↑</span><span>@</span><span>≥</span><span>π</span><span>»</span></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script type="module" src="js/participante.js"></script>
</body>
</html>
